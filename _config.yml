# Site settings. Edit the values below; see README.md for how to add projects.

# Main Page Setup
title: Brody Dickson | Mechanical Engineering Portfolio # shows in the browser tab


# Hero Section
name: Brody Dickson
headline: Mechanical Engineering @ Northeastern · Seeking Spring 2027 Co-op (Jan–Jun)
description: >- # dont remove this line. this will ignore all new lines until the next section
  I'm a mechanical engineering student at Northeastern who likes building things that
  actually work: SolidWorks enclosures, laser-cut and 3D-printed parts, welded metal,
  and the Raspberry Pi Pico electronics and code that bring them to life. I also have a
  background in software and experience building my own apps.

# Place your profile image in /assets/images/profile-image/ and edit the file name
profile_image: /assets/images/profile-image/avatar.jpeg


# Resume (PDF in assets/resume/). Use a copy WITHOUT a phone number - this site is public.
resume-url: /assets/resume/Brody_Dickson_Resume.pdf


# External links - icons next to your name. Entries left blank will not appear.
external-links:
  linkedin: brody-dickson-651912299   # https://www.linkedin.com/in/{slug}
  github: bfddeveloper                # https://github.com/{slug}
  stackoverflow:
  medium:
  x-twitter:
  threads:
  instagram:
  youtube:
  discord:
  bluesky:


# Skills Section - grouped by category. Indentation must be exact.
skills:
  - category: Design & Analysis
    tools:
    - SolidWorks
    - AutoCAD
    - MATLAB
    - Microsoft Excel
    - Ghost Arcade (visual projection)
  - category: Fabrication & Machining
    tools:
    - Lathe
    - Milling
    - Laser Cutting
    - 3D Printing (FDM)
    - Welding
    - Soldering
    - Woodworking
  - category: Electronics & Embedded
    tools:
    - Raspberry Pi Pico
    - MicroPython
    - Sensor integration & calibration
    - I2C OLED / LCD displays
    - Breadboarding & perfboard
    - Small electronics repair
  - category: Programming
    tools:
    - Python
    - Swift / SwiftUI
    - JavaScript / Node.js
    - React
    - HTML / CSS
    - Git & GitHub


# Contact form via Formspree (https://formspree.io). Paste only the 8-character form ID.
# Leave blank to show an email button instead of the form.
formspree-key:
contact-email: dickson.br@northeastern.edu



# Active theme. Keep the indentation the same.
colors:
  text: "#1a1c20"
  border: "#ddd"
  link: "#4a76ee"
  highlight: "#0c0cf2"
  background: "#ffffff"
  light_background: "#f3f5fb"

# Project sections on the home page, in display order. A project's `category` must match one of these.
project-categories:
  - Hardware
  - CAD
  - Specialty
  - Software



#########################################################################################################
# Build settings for the site. Editing the below may cause the site to malfunction.

collections:
  projects:
    output: true
    permalink: /projects/:path/


markdown: kramdown
highlighter: rouge
kramdown:
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: 'highlight'
    span:
      line_numbers: false
    block:
      line_numbers: false
      start_line: 1
      indent: 0

plugins:
  - jekyll-feed

include:
  - _projects

exclude:
  - README.md
  - PROJECT_TEMPLATE.md
  - LICENSE
  - Gemfile
  - Gemfile.lock
  - pdf
